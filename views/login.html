<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Kundeeeq</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fbf7f1;color:#382b28;font:14px Arial,sans-serif;padding:24px}main{width:100%;max-width:430px;background:#fffdf9;padding:38px;border:1px solid #e8dfd5;border-radius:16px;box-shadow:0 12px 50px #7b111308}.brand{font:32px Georgia,serif;letter-spacing:3px;color:#7b1113}.eyebrow{font-size:9px;letter-spacing:2px;color:#8b725e;margin-top:10px}h1{font:34px Georgia,serif;margin:32px 0 10px;color:#611719}p{color:#77675f;line-height:1.7}label{display:block;margin-top:20px;font-size:12px;color:#644b40}input{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #ddcdbc;background:#fbf7f1;border-radius:7px;font:14px Arial}button{margin-top:25px;width:100%;background:#7b1113;border:0;padding:14px;color:#fbf7f1;border-radius:7px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}a{color:#7b1113}.error{color:#a33133;font-size:12px;min-height:18px;margin-top:16px}small{display:block;color:#8b725e;margin-top:22px;line-height:1.7}input:focus-visible,button:focus-visible{outline:2px solid #ad7e51;outline-offset:3px}@media(max-width:450px){main{padding:27px}}</style></head><body><main><div class="brand">KUNDEEEQ</div><div class="eyebrow">BUSINESS STUDIO</div><h1>Your business, in focus.</h1><p>Sign in to your inventory, transactions and profit.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button type="submit">Sign in</button><div class="error" role="alert" id="error"></div></form><small>Administrator access only. Contact the person managing this installation if you need a password reset.</small></main><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('button'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to sign in.');location.href='/'}catch(e){error.textContent=e.message}finally{button.disabled=false}})</script></body></html>
